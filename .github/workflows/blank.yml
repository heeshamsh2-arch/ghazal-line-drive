name: Build GharzaLine APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "GharzaLine-GitHub-Ready.zip"
      - ".github/workflows/blank.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          rm -rf GharzaLine-build
          mkdir GharzaLine-build
          unzip -q GharzaLine-GitHub-Ready.zip -d GharzaLine-build

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: GharzaLine-build
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp GharzaLine-build/app/build/outputs/apk/debug/app-debug.apk GharzaLine.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GharzaLine-APK
          path: GharzaLine.apk
          retention-days: 30
